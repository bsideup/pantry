distributable:
  url: https://github.com/esphome/esphome/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

display-name: ESPHome

versions:
  github: esphome/esphome

dependencies:
  pkgx.sh: ^1

build:
  dependencies:
    python.org: ~3.9
  script:
    - bkpyvenv stage {{prefix}} {{version}}
    - ${{prefix}}/venv/bin/pip install .
    - bkpyvenv seal {{prefix}} tox

provides:
- bin/esphome

test:
  dependencies:
    gnu.org/coreutils: '*'
  script: test "$(esphome --version|cut -d$'\n' -f2|cut -d' ' -f1)" = {{version}}